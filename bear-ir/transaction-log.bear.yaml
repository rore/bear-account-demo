version: v1
block:
  name: TransactionLog
  kind: logic
  operations:
    - name: AppendTransaction
      contract:
        inputs:
          - name: accountId
            type: string
          - name: type
            type: enum
          - name: requestId
            type: string
          - name: amountCents
            type: int
          - name: balanceAfterCents
            type: int
          - name: note
            type: string
        outputs:
          - name: txSeq
            type: int
      uses:
        allow:
          - port: transactionStore
            kind: external
            ops: [append]
      invariants:
        - kind: non_negative
          field: txSeq
    - name: GetTransactions
      contract:
        inputs:
          - name: accountId
            type: string
          - name: sinceSeq
            type: int
        outputs:
          - name: transactionsJson
            type: string
      uses:
        allow:
          - port: transactionStore
            kind: external
            ops: [list]
  effects:
    allow:
      - port: transactionStore
        kind: external
        ops: [append, list]
  invariants:
    - kind: non_negative
      field: txSeq