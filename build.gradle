plugins {
    id 'java'
}

group = 'com.bear.account'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs += 'build/generated/bear/src/main/java'
        }
    }
    test {
        java {
            srcDirs += 'build/generated/bear/src/test/java'
        }
    }
}
